[package]
name = "vcrs-mount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Volume mounting for vcrs-core VeraCrypt-compatible volumes: FAT formatting, and raw-disk exposure over iSCSI"

[dependencies]
vcrs-core = { path = "../vcrs-core" }
log.workspace = true
fatfs.workspace = true
iscsi-target.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["consoleapi", "minwindef"] }
