[package]
name = "vcrs-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Put a served vcrs volume on a drive letter and take it off again (Windows)"

[dependencies]
vcrs-core = { path = "../vcrs-core" }
vcrs-mount = { path = "../vcrs-mount" }
anyhow = "1"
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "cfgmgr32",
    "consoleapi",
    "errhandlingapi",
    "fileapi",
    "handleapi",
    "ioapiset",
    "minwinbase",
    "namedpipeapi",
    "processenv",
    "processthreadsapi",
    "sddl",
    "securitybaseapi",
    "setupapi",
    "winbase",
    "winioctl",
    "winnt",
    "winsvc",
] }
