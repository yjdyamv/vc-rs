[workspace]
resolver = "2"
members = ["crates/vcrs-core", "crates/vcrs-cli", "crates/vcrs-mount"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/example/vc-rs"

[workspace.dependencies]
botan = { version = "0.14", default-features = false, features = ["std", "vendored"] }
# Direct dependency on the raw FFI layer: the safe `botan` wrapper passes
# passphrases as `&str` (Botan then calls strlen), which cannot express
# VeraCrypt's byte-exact password+keyfile-pool input.
botan-sys = "1"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
fatfs = "0.3"
# Pure-Rust iSCSI target: exposes the decrypted volume as a *block device* over
# a loopback TCP socket, so Windows' own signed NTFS/exFAT drivers can mount any
# filesystem.  (A filesystem framework such as Dokany could only ever present
# filesystems we implement ourselves; its use was dropped for that reason.)
iscsi-target = "1.0"
log = "0.4"

# Local fork of `iscsi-target` 1.0.0 (vendor/iscsi-target).  The upstream crate
# has three interoperability bugs against the Microsoft iSCSI initiator; see
# vendor/iscsi-target/PATCHES.md.  Kept as a patch so the fixes stay reviewable.
[patch.crates-io]
iscsi-target = { path = "vendor/iscsi-target" }

[profile.release]
opt-level = 3
lto = "thin"
